<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Főoldal</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-vh-100 d-flex flex-column border border-primary border-3 text-white">

  <header class="text-center p-3">
    <h1 class="h3 fw-normal pt-2">Főoldal</h1>
  </header>

  <main class="flex-grow-1 d-flex flex-column justify-content-center text-center gap-5 p-3">
  <section>
    <h2 class="h2 fw-normal mb-0">Nehézség</h2>
    <p class="small mb-4"><small>(Labda sebessége)</small></p>
    <div class="row row-cols-1 row-cols-md-3 g-3 justify-content-center" role="group" aria-label="Nehézség">
      
      <div class="col-md-2 d-grid">
        <input type="radio" class="btn-check" name="nehezseg" id="nehezseg-lassu" value="lassu" autocomplete="off">
        <label class="btn btn-outline-light fw-semibold py-2" for="nehezseg-lassu">Lassú</label>
      </div>

      <div class="col-md-2 d-grid">
        <input type="radio" class="btn-check" name="nehezseg" id="nehezseg-normal" value="normal" autocomplete="off" checked>
        <label class="btn btn-outline-light fw-semibold py-2" for="nehezseg-normal">Normál</label>
      </div>

      <div class="col-md-2 d-grid">
        <input type="radio" class="btn-check" name="nehezseg" id="nehezseg-gyors" value="gyors" autocomplete="off">
        <label class="btn btn-outline-light fw-semibold py-2" for="nehezseg-gyors">Gyors</label>
      </div>

    </div>
  </section>

  <section>
    <h2 class="fs-6 fw-normal mb-4">Pontok a győzelemhez</h2>
    <div class="row row-cols-5 g-2 justify-content-center" role="group" aria-label="Pontok a győzelemhez">
      
      <div class="col-4 col-md-1 d-grid">
        <input type="radio" class="btn-check" name="pontok" id="pont-5" value="5" autocomplete="off">
        <label class="btn btn-outline-light fw-semibold py-2" for="pont-5">5</label>
      </div>

      <div class="col-4 col-md-1 d-grid">
        <input type="radio" class="btn-check" name="pontok" id="pont-7" value="7" autocomplete="off">
        <label class="btn btn-outline-light fw-semibold py-2" for="pont-7">7</label>
      </div>

      <div class="col-4 col-md-1 d-grid">
        <input type="radio" class="btn-check" name="pontok" id="pont-10" value="10" autocomplete="off" checked>
        <label class="btn btn-outline-light fw-semibold py-2" for="pont-10">10</label>
      </div>

      <div class="col-4 col-md-1 d-grid">
        <input type="radio" class="btn-check" name="pontok" id="pont-15" value="15" autocomplete="off">
        <label class="btn btn-outline-light fw-semibold py-2" for="pont-15">15</label>
      </div>

      <div class="col-4 col-md-1 d-grid">
        <input type="radio" class="btn-check" name="pontok" id="pont-20" value="20" autocomplete="off">
        <label class="btn btn-outline-light fw-semibold py-2" for="pont-20">20</label>
      </div>

    </div>
  </section>
</main>

  <footer class="text-center small p-3">
    © 2026 Minden jog fenntartva!
  </footer>




</body>
</html>
